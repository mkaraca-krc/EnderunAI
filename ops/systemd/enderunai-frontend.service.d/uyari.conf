# NÖBET/1 · K8 — DÜŞTÜĞÜNDE HABER VER.
#
# ÖLÇÜLDÜ (2026-09-08): uyarı kanalı vardı ve teslim ettiği
# kanıtlanmıştı, ama OnFailure yalnız üç yardımcı birime bağlıydı
# (cc-devir, enderun-rapor, geri-yükleme-tatbikatı). Canlıyı taşıyan
# enderunai-backend, enderunai-frontend ve enderun-backup birimlerinin
# HİÇBİRİNDE yoktu: düşerlerse kimseye haber gitmiyordu.
#
# NEDEN DROP-IN, NEDEN BİRİM DOSYASINI DEĞİŞTİRMİYORUZ: ana birim
# dosyaları depoda değil, yalnız /etc'te duruyor. Onları elle
# düzenlemek geri alınması zor bir değişiklik olurdu; drop-in tek
# dosya silinerek geri alınır ve asıl birim dosyasına dokunmaz.
#
# SINIR: Restart=always olduğu için OnFailure ancak birim
# StartLimitBurst'ü aşıp "failed" durumuna DÜŞTÜĞÜNDE ateşlenir —
# yani tek bir çökme değil, ısrarlı çökme haber verilir. Bu bilinçli:
# kendini toparlayan bir yeniden başlatma için posta göndermek,
# gürültüyle asıl uyarıyı boğardı.
[Unit]
OnFailure=enderun-uyari@%N.service
