name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            backend/EnderunAI.Api/EnderunAI.Api.csproj
            backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj

      - name: Restore
        run: dotnet restore backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Verify migration model
        env:
          DB_CONNECTION: Host=localhost;Port=5432;Database=enderun_ci;Username=postgres;Password=postgres
        run: dotnet ef migrations has-pending-model-changes --project backend/EnderunAI.Api/EnderunAI.Api.csproj --startup-project backend/EnderunAI.Api/EnderunAI.Api.csproj --configuration Release --no-build
