name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enderun_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: enderun_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enderun_user -d enderun_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=enderun_ai_test;Username=enderun_user;Password=ci_test_password"
      DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=enderun_ai_test;Username=enderun_user;Password=ci_test_password"
      # SAHTE DEĞER, AÇIK ÖNEKLE İŞARETLİ (sır bekçisi kuralı).
      # "TEST-" öneki rastlantıya bırakılmıyor, elle konuyor:
      # gerçek bir sırrın bu karakterlerle başlaması pratikte
      # imkânsız. Bekçi bu öneki gördüğünde geçiyor — böylece bir
      # sonraki denetimde bu değeri yeniden hash'lemek gerekmiyor.
      JWT_SECRET: "TEST-ci-only-jwt-secret-never-used-in-production-0123456789"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            backend/EnderunAI.Api/EnderunAI.Api.csproj
            backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj

      - name: Grant CREATEDB to CI database role
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h 127.0.0.1 -U enderun_user -d enderun_ai_test -c "ALTER ROLE enderun_user CREATEDB;"

      - name: Restore
        run: dotnet restore backend/EnderunAI.Api/EnderunAI.Api.csproj

      - name: Build
        run: dotnet build backend/EnderunAI.Api/EnderunAI.Api.csproj --configuration Release --no-restore

      - name: Run backend integration tests
        run: dotnet test backend/EnderunAI.Api.Tests/EnderunAI.Api.Tests.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/enderun-ai/package-lock.json

      - name: Install dependencies
        working-directory: frontend/enderun-ai
        run: npm ci

      - name: Build and verify critical pages
        run: ./scripts/check-frontend-build.sh
