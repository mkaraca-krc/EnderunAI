name: Enderun AI CI

on:
  push:
    branches: [main, sprint-5-secretariat]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/EnderunAI.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore backend
        run: dotnet restore
      - name: Build backend
        run: dotnet build --configuration Release --no-restore

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/enderun-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/enderun-ai/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
