name: Generate Secretariat Migration

on:
  push:
    paths:
      - '.github/workflows/generate-secretariat-migration.yml'
  pull_request:
    paths:
      - '.github/workflows/generate-secretariat-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: Host=localhost;Database=enderun_design;Username=design;Password=design

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/EnderunAI.Api/EnderunAI.Api.csproj

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Generate migration and snapshot
        shell: bash
        run: |
          rm backend/EnderunAI.Api/Migrations/20260726235500_CompleteSecretariatModule.cs
          dotnet ef migrations add CompleteSecretariatModule \
            --project backend/EnderunAI.Api/EnderunAI.Api.csproj \
            --startup-project backend/EnderunAI.Api/EnderunAI.Api.csproj \
            --output-dir Migrations

      - name: Collect generated files
        shell: bash
        run: |
          mkdir generated-secretariat-migration
          cp backend/EnderunAI.Api/Migrations/*_CompleteSecretariatModule.cs generated-secretariat-migration/
          cp backend/EnderunAI.Api/Migrations/AppDbContextModelSnapshot.cs generated-secretariat-migration/

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: generated-secretariat-migration
          path: generated-secretariat-migration
          if-no-files-found: error
          retention-days: 2
