name: Generate Secretariat Migration

on:
  pull_request:
    paths:
      - '.github/workflows/generate-secretariat-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: Host=localhost;Database=enderun_design;Username=design;Password=design

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/secretariat-completion-20260726

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/EnderunAI.Api/EnderunAI.Api.csproj

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Generate migration and snapshot
        shell: bash
        run: |
          rm backend/EnderunAI.Api/Migrations/20260726235500_CompleteSecretariatModule.cs
          dotnet ef migrations add CompleteSecretariatModule \
            --project backend/EnderunAI.Api/EnderunAI.Api.csproj \
            --startup-project backend/EnderunAI.Api/EnderunAI.Api.csproj \
            --output-dir Migrations

      - name: Commit generated EF artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/EnderunAI.Api/Migrations
          git diff --cached --quiet && {
            echo "Generated migration did not change the repository."
            exit 1
          }
          git commit -m "chore: finalize Secretariat EF migration"
          git push origin HEAD:feature/secretariat-completion-20260726
