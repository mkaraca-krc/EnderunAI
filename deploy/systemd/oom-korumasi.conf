# CANLI UYGULAMA EN SON ÖLSÜN (2026-08-26, üç OOM'dan sonra).
#
# Bu makinede canlı uygulama ile test koşusu AYNI yerde. Bellek
# tükendiğinde çekirdek en çok belleği tutanı seçme eğiliminde; test
# derlemesi 4,5 GB tutarken canlı API 160 MB tutuyor, yani doğru kurban
# zaten test. Yine de bunu şansa bırakmıyoruz: negatif ayar, çekirdeğin
# canlı API'yi seçme olasılığını açıkça düşürür.
#
# BU BİR ÇÖZÜM DEĞİL, HAFİFLETMEDİR. Kalıcı çözüm testleri ayrı
# makinede koşturmaktır.
[Service]
OOMScoreAdjust=-500

# ── KURULUM ────────────────────────────────────────────────────────
# Bu dosya İKİ birimin drop-in dizinine kopyalanır:
#   /etc/systemd/system/enderunai-backend.service.d/oom-korumasi.conf
#   /etc/systemd/system/enderunai-frontend.service.d/oom-korumasi.conf
#   systemctl daemon-reload && systemctl restart enderunai-backend enderunai-frontend
#
# REPODA KOPYASI TUTULUYOR çünkü /etc altındaki dosya makine yeniden
# kurulduğunda kaybolur ve kaybolduğu FARK EDİLMEZ — koruma sessizce
# yok olur. Yedek betiğinde ve nginx yapılandırmasında uygulanan
# disiplinin aynısı.
#
# DOĞRULAMA (yazılmış olmak uygulanmış olmak değildir):
#   cat /proc/$(systemctl show enderunai-backend -p MainPID --value)/oom_score_adj
#   -500 okumalı.
