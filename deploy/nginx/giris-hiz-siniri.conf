# ═══════════════════════════════════════════════════════════════════
# GİRİŞ HIZ SINIRI — IP BAŞINA (2026-09-15)
# ═══════════════════════════════════════════════════════════════════
#
# ═══ ÖLÇÜLEN OLAY ═══
#
# 16 günde `/login` sayfasına 109.495 istek, 621 ayrı kaynak. Bunun
# BÜYÜK KISMI BİZİM KULLANICILARIMIZDI (78.175 → 38.039, 31.223 →
# 33.529; GİRİŞ-DÖNGÜ/1 döngüsünün izi). Saldırı kümesi 185.177.x.x:
# altı IP, toplam ~22.000 istek.
#
# ═══ SALDIRGAN GERÇEK GİRİŞ UCUNA HİÇ DOKUNMADI ═══
#
# 185.177 kümesinin `POST /api/backend/auth/login` sayısı: SIFIR.
# POST'ları `/login` (404) ve `phpunit/eval-stdin.php` gibi PHP sömürü
# yollarına gitti — yani hedefli parola denemesi değil, genel bir PHP
# tarayıcısı. Gerçek uca 16 günde 96 POST geldi; 71'i BAŞARILI ve
# hepsi bizim kullanıcılarımızın adreslerinden.
#
# Yine de sınır kuruluyor: bugün tarayıcı olan yarın deneme yapabilir
# ve canlıda gerçek hesaplar var.
#
# ═══ SINIR CÖMERT — GEÇİŞ GÜNÜNDE PERSONELİ KİLİTLEMEZ ═══
#
#   giris_post  20r/m + burst 10  → ilk 10 anında, sonra ~3 sn'de bir.
#                                   Parolayı üç kez yanlış girmek SORUN
#                                   DEĞİL. (Ölçüm: gerçek uca 16 günde
#                                   toplam 96 POST — normal kullanım
#                                   bu sınırın çok altında.)
#   giris_sayfa 60r/m + burst 30  → sayfa yüklemesi serbest; saniyede
#                                   birden fazla süreklilik engellenir.
#
# ═══ KALICI KİLİT YOK ═══
#
# `limit_req` kayan pencereyle çalışır: hız düşünce istek yeniden
# geçer. Hesap kilidi YOKTUR. Kalıcı kilit, saldırganın elinde hizmet
# engelleme aracına dönüşürdü (kullanıcı adını bilen herkes o hesabı
# kilitleyebilirdi).
#
# ═══ GÜNLÜĞE DÜŞER ═══
#
# Engellenen istek erişim günlüğüne **429** olarak düşer.
#
# ERROR.LOG SEVİYESİ ÖLÇÜLDÜ (2026-09-15): `nginx.conf` içinde
# `error_log /var/log/nginx/error.log;` — seviye verilmemiş, yani
# VARSAYILAN `error`. `limit_req_log_level warn` yazsaydım satır
# error.log'a HİÇ DÜŞMEZDİ. Önce warn yazdım, ölçtüm, 0 eşleşme
# çıktı; seviye `error`e alındı. (Kendi cümlemi ölçmeden yazmıştım.)
#
limit_req_zone $binary_remote_addr zone=giris_post:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=giris_sayfa:10m rate=60r/m;

# 503 DEĞİL 429: 503 "sunucu bozuk" der ve izlemede gerçek arızayla
# karışır. 429 "çok fazla istek" der — doğru olan bu.
limit_req_status 429;
limit_req_log_level error;

# ═══════════════════════════════════════════════════════════════════
# BU SINIRI GENİŞLETMEYİN — `location =` BİLEREK SEÇİLDİ
# ═══════════════════════════════════════════════════════════════════
#
# Sınır YALNIZ giriş uçlarına, TAM EŞLEŞMEYLE bağlıdır:
#     location = /api/backend/auth/login
#     location = /api/auth/login
#     location = /login
#
# `location ^~ /api/backend/auth/` yazmak cazip görünür — YAZMAYIN.
#
# SEBEP ÖLÇÜLDÜ: `/api/backend/auth/work-hours-status` ucu **her açık
# sekmeden DAKİKADA BİR** çağrılıyor (mesai izleyicisi). Ölçüm: tek
# kullanıcının bir günde 166 çağrısı. Önekle sınırlarsanız:
#   · birkaç sekme açan bir kullanıcı kendi kendini 429'a düşürür,
#   · izleyici "karar alınamadı" hâline geçer,
#   · ve kullanıcı bunu ekranda OTURUM SORUNU olarak yaşar.
#
# Yani öneki genişletmek saldırıyı değil, KENDİ KULLANICILARIMIZI
# keser. Yeni bir uç sınırlanacaksa kendi `location =` bloğu açılır.
