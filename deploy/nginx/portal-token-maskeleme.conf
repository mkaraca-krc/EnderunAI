# PORTAL TOKEN'I ERİŞİM KAYDINDA MASKELENİR
#
# NEDEN: işveren portalı bağlantısı /portal/{token} biçiminde, yani
# token URL YOLUNDA taşınıyor. nginx varsayılan olarak istek satırının
# tamamını kaydeder; bu da 256 bitlik anahtarın düz metin olarak
# /var/log/nginx/access.log içine ve oradan log yedeklerine düşmesi
# demektir. Kaydı okuyabilen herkes çalışan bir portal anahtarı elde
# ederdi — uygulama tarafında token'ı maskelemek, kaydın kendisi
# sızdırıyorsa anlamsız kalır.
#
# NEREYE: /etc/nginx/conf.d/portal-token-maskeleme.conf
# (http bloğunun içine dahil edilir; map ve log_format http düzeyinde
# tanımlanmak zorunda.)
#
# SONRA: nginx.conf içindeki
#     access_log /var/log/nginx/access.log;
# satırı şununla değiştirilir:
#     access_log /var/log/nginx/access.log maskeli;
#
# DOĞRULAMA: nginx -t, ardından reload; sonra bir portal isteği atıp
# access.log'da "/portal/***" göründüğünü teyit et.

map $request_uri $maskeli_uri {
    # /portal/<token> ve /api/backend/portal/<token>/... — token yerine ***
    "~^(?<onek>/(?:api/backend/)?portal/)[A-Za-z0-9_\-]{16,}(?<kalan>/.*)?$"  "${onek}***${kalan}";
    default $request_uri;
}

log_format maskeli '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $maskeli_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
